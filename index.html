<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>elistly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function() {
    var theme = localStorage.getItem('theme');
    if (!theme || theme === 'system') {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    var headerColor = localStorage.getItem('headerColor') || '#1a1b1e';
    var accentColor = localStorage.getItem('accentColor') || '#2a7ebf';
    document.documentElement.style.setProperty('--header-bg', headerColor);
    var h = headerColor.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    document.documentElement.style.setProperty('--header-text', (r * 0.299 + g * 0.587 + b * 0.114) > 186 ? '#202124' : '#ffffff');
    document.documentElement.style.setProperty('--accent-color', accentColor);
    var ar = parseInt(accentColor.replace('#', '').substr(0, 2), 16), ag = parseInt(accentColor.replace('#', '').substr(2, 2), 16), ab = parseInt(accentColor.replace('#', '').substr(4, 2), 16);
    document.documentElement.style.setProperty('--accent-color-rgb', ar + ', ' + ag + ', ' + ab);
    var logoStyle = localStorage.getItem('logoStyle') || 'color';
    document.documentElement.setAttribute('data-logo-style', logoStyle);
  })();
  </script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/materialicons/v145/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- HEADER -->
    <header>
      <div class="header-left">
        <button type="button" class="header-icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Open menu" aria-expanded="false">
          <span class="material-icons">menu</span>
        </button>
        <img id="appLogo" src="img/elistly-logo.svg" alt="elistly" class="app-logo" />
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Search entities..." aria-label="Search entities">
          <span class="material-icons search-icon">search</span>
        </div>
        <button type="button" class="header-icon-btn search-toggle" id="searchToggle" aria-label="Search">
          <span class="material-icons">search</span>
        </button>
      </div>
      <div class="header-actions">
        <div class="dropdown" id="profileDropdownWrap" style="display: none;">
          <button type="button" class="header-icon-btn" id="profileBtn" aria-label="Profile" aria-haspopup="true" aria-expanded="false">
            <span class="material-icons">person</span>
          </button>
          <div class="dropdown-menu" id="profileMenu"></div>
        </div>
        <button type="button" class="header-icon-btn" id="settingsBtn" aria-label="Settings" onclick="if(window.App) App.showSettingsModal();">
          <span class="material-icons">settings</span>
        </button>
      </div>
    </header>
    <script>
    (function() {
      var s = document.documentElement.getAttribute('data-logo-style') || 'color';
      var img = document.getElementById('appLogo');
      if (img && s !== 'color') img.src = 'img/elistly-logo-' + s + '.svg';
    })();
    </script>
    
    <!-- SIDEBAR -->
    <aside>
      <div id="workspaceSwitcherWrap" class="workspace-switcher-wrap"></div>
      <ul id="categoryList"></ul>
    </aside>
    
    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      <!-- Dynamic content loads here -->
    </div>
  </div>
  
  <!-- SNACKBAR -->
  <div id="snackbar" class="snackbar"></div>
  
  <!-- ICON PICKER MODAL -->
  <div id="iconPickerModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Select an Icon</h3>
      <div class="icon-grid" id="iconGrid"></div>
      <button class="btn" onclick="App.closeIconPicker()">Close</button>
    </div>
  </div>
  
  <!-- CONFIRMATION MODAL -->
  <div id="confirmModal" class="modal" style="display:none;" data-persistent>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="confirmTitle">Confirm Action</h3>
      </div>
      <div class="modal-body">
        <p id="confirmMessage"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="App.closeConfirmModal()">Cancel</button>
        <button class="btn btn-danger" id="confirmButton">Confirm</button>
      </div>
    </div>
  </div>
  
  <!-- (The Update Modal is dynamically created when needed) -->
  
  <!-- Config: set default so missing config.js does not break the app -->
  <script>window.ELISTLY_CONFIG = window.ELISTLY_CONFIG || {};</script>
  <script src="config.js"></script>
  <!-- Supabase (only required when using config.js with Supabase keys) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SortableJS for drag-and-drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
  <script src="setup-blank.js"></script>
  <script src="setup-library.js"></script>
  <script src="setup-it.js"></script>
  <script src="setup-staff.js"></script>
  <script src="setup-property.js"></script>
  <script src="sample-data.js"></script>
  <script src="faq.js"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
