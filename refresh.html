<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elistly – Clear data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="refresh-page">
  <h1>Data cleared</h1>
  <p>All Elistly data has been removed from this browser. Open the app to start fresh.</p>
  <a href="index.html">Open Elistly</a>
  <script>
    (function () {
      var KEY = 'elistlyData';
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
    })();
  </script>
</body>
</html>
