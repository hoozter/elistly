<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elistly – Clear data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 420px;
      margin: 3rem auto;
      padding: 1.5rem;
      background: #f8f9fa;
      color: #202124;
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.5rem; }
    p { color: #5f6368; margin-bottom: 1.25rem; }
    a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #01729C;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Data cleared</h1>
  <p>All Elistly data has been removed from this browser. Open the app to start fresh.</p>
  <a href="index.html">Open Elistly</a>
  <script>
    (function () {
      var KEY = 'elistlyData';
      try {
        localStorage.removeItem(KEY);
      } catch (e) {}
    })();
  </script>
</body>
</html>
